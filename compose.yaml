services:
  postgres:
    restart: always
    image: postgres:latest
    environment:
      POSTGRES_DB: armor
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: pass123
    volumes:
      - ./db:/var/lib/postgresql
    ports:
      - 5432:5432
  web:
    depends_on:
      - postgres
    build: .
    ports:
      - "8080:8080"